<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profil Loueur</title>
</head>
<body>

<h2>Profil Loueur</h2>

<div th:if="${loueur != null}">
    <p><strong>Nom :</strong> <span th:text="${loueur.nom}"></span></p>
    <p><strong>Prénom :</strong> <span th:text="${loueur.prenom}"></span></p>
    <p><strong>Username :</strong> <span th:text="${loueur.username}"></span></p>
    <p><strong>Email :</strong> <span th:text="${loueur.email}"></span></p>
    <p><strong>Téléphone :</strong> <span th:text="${loueur.telephone}"></span></p>
    <p><strong>Ville :</strong> <span th:text="${loueur.ville}"></span></p>
    <p><strong>Type de permis :</strong> <span th:text="${loueur.typepermis}"></span></p>

    <hr/>

    <p><strong>Nombre d'évaluations :</strong> <span th:text="${loueur.nombreevaluations}">0</span></p>
    <p><strong>Note moyenne :</strong> <span th:text="${loueur.notemoyenne}">0</span></p>
</div>

<p th:if="${loueur == null}">
    Utilisateur non connecté.
</p>

<div>
    <a th:href="@{/vehicule/liste}">Afficher la liste de véhicules</a> <br>
</div>

<a th:href="@{/loueur/profil/modifier}">
    <button>Modifier mon profil</button>
</a>

<a th:href="@{/utilisateur/logout}">Déconnexion</a>

</body>
</html>

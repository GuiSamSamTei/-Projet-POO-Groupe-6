<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inscription Loueur</title>
</head>
<body>
<h1>Formulaire Loueur</h1>
<p>Si vous voyez ceci, le template fonctionne.</p>
<form th:action="@{/loueur/inscription}" th:object="${loueur}" method="post">
    <label>Nom: <input type="text" th:field="*{nom}"/></label><br/>
    <label>Prénom: <input type="text" th:field="*{prenom}"/></label><br/>
    <button type="submit">S’inscrire</button>
</form>
</body>
</html>

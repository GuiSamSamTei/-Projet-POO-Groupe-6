<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un véhicule</title>
</head>
<body>

<h1>Ajouter un nouveau véhicule</h1>

<form th:action="@{/vehicules/ajouter}" th:object="${vehicule}" method="post">

    <label>Marque :</label>
    <input type="text" th:field="*{marque}" required><br><br>

    <label>Modèle :</label>
    <input type="text" th:field="*{modele}" required><br><br>

    <label>Ville :</label>
    <input type="text" th:field="*{villedispo}" required><br><br>

    <label>Disponible :</label>
    <input type="checkbox" th:field="*{vehiculedispo}"><br><br>

    <label>Prix par jour :</label>
    <input type="number" step="0.01" th:field="*{prixjour}" required><br><br>

    <button type="submit">Ajouter</button>
</form>

<p>
    <a th:href="@{/vehicules/liste}">Retour à la liste</a>
</p>

</body>
</html>

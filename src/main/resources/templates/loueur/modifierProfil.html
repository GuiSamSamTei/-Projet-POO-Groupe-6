<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifier mon profil</title>
</head>
<body>

<h2>Modifier mon profil</h2>

<form th:action="@{/loueur/profil/modifier}"
      th:object="${loueur}"
      method="post">

    <!-- ID caché (bonne pratique) -->
    <input type="hidden" th:field="*{id}" />

    <p>
        <label>Nom :</label>
        <input type="text" th:field="*{nom}" required />
    </p>

    <p>
        <label>Prénom :</label>
        <input type="text" th:field="*{prenom}" required />
    </p>

    <p>
        <label>Username :</label>
        <input type="text" th:field="*{username}" required />
    </p>

    <p>
        <label>Email :</label>
        <input type="email" th:field="*{email}" required />
    </p>

    <p>
        <label>Téléphone :</label>
        <input type="text" th:field="*{telephone}" />
    </p>

    <p>
        <label>Ville :</label>
        <input type="text" th:field="*{ville}" required />
    </p>

    <p>
        <label>Type de permis :</label>
        <select th:field="*{typepermis}" required>
            <option value="" disabled>Choisissez un type de permis</option>
            <option value="AM">AM</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
        </select>
    </p>

    <hr/>

    <p>
        <strong>Nombre d'évaluations :</strong>
        <span th:text="${loueur.nombreevaluations}">0</span>
    </p>

    <p>
        <strong>Note moyenne :</strong>
        <span th:text="${loueur.notemoyenne}">0</span>
    </p>

    <button type="submit">Enregistrer les modifications</button>
</form>

<br/>
<a th:href="@{/loueur/profil}">Annuler</a>

</body>
</html>

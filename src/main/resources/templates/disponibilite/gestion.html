    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>
            Gestion des disponibilités -
            <span th:text="${vehicule.marque} + ' ' + ${vehicule.modele}"></span>
        </title>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>

    <body class="container mt-4">

    <h1>
        Disponibilités du véhicule :
        <span th:text="${vehicule.marque + ' ' + vehicule.modele}"></span>
    </h1>

    <h3>Calendrier des disponibilités :</h3>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Date de début</th>
            <th>Date de fin</th>
            <th>Description</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dispo : ${disponibilites}">
            <td th:text="${dispo.dateDebut}"></td>
            <td th:text="${dispo.dateFin}"></td>
            <td th:text="${dispo.description}"></td>
        </tr>
        </tbody>
    </table>

    <h3>Ajouter une disponibilité :</h3>

    <form th:action="@{'/vehicules/' + ${vehicule.id} + '/disponibilites'}"
          method="post">

        <div class="mb-3">
            <label for="dateDebut" class="form-label">Date de début :</label>
            <input type="date"
                   id="dateDebut"
                   name="dateDebut"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label for="dateFin" class="form-label">Date de fin :</label>
            <input type="date"
                   id="dateFin"
                   name="dateFin"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description :</label>
            <input type="text"
                   id="description"
                   name="description"
                   class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">
            Ajouter
        </button>


    </form>



    </body>
    </html>

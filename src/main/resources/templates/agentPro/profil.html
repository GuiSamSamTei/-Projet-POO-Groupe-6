<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profil Agent Professionnel</title>
</head>
<body>

<h2>Profil Agent Professionnel</h2>

<p><strong>Raison sociale :</strong> <span th:text="${user.raisonsociale}"></span></p>
<p><strong>SIRET :</strong> <span th:text="${user.siret}"></span></p>
<p><strong>Username :</strong> <span th:text="${user.username}"></span></p>
<p><strong>Email :</strong> <span th:text="${user.email}"></span></p>
<p><strong>Téléphone :</strong> <span th:text="${user.telephone}"></span></p>

<hr/>

<p><strong>Adresse :</strong> <span th:text="${user.adresse}"></span></p>
<p><strong>Téléphone pro :</strong> <span th:text="${user.telephonepro}"></span></p>

<hr/>

<p><strong>Note moyenne :</strong>
    <span th:text="${#numbers.formatDecimal(user.notemoyenne, 1, 'POINT', 2, 'NONE')}"></span>
</p>
<p><strong>Nombre d'évaluations :</strong> <span th:text="${user.nombreevaluations}"></span></p>
<p><strong>Nombre de véhicules :</strong> <span th:text="${user.nombrevehicules}"></span></p>
<p><strong>Revenus totaux :</strong>
    <span th:text="${#numbers.formatDecimal(user.revenustotaux, 1, 'POINT', 2, 'NONE')}"></span> €
</p>

<hr/>

<h3>Mes véhicules</h3>
<ul>
    <li th:each="vehicule : ${vehicules}">
        <!-- Lien vers la page détail du véhicule -->
        <a th:href="@{/vehicule/afficher/{id}(id=${vehicule.id})}">
            <span th:text="${vehicule.marque} + ' ' + ${vehicule.modele}"></span>
        </a>
        - Prix/jour : <span th:text="${vehicule.prixjour}"></span> €
        - Kilométrage : <span th:text="${vehicule.kilometrage}"></span> km
        - Note : <span th:text="${vehicule.notevehicule}"></span>/5
    </li>
</ul>

<a th:href="@{/agent-pro/profil/modifier}">
    <button>Modifier mon profil</button>
</a>

<a th:href="@{/utilisateur/logout}">Déconnexion</a>

</body>
</html>

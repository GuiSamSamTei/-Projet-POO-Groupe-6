<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier mon profil - AutoPartage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        .form-section-title {
            color: var(--secondary-color);
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
            margin-bottom: 20px;
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .form-label {
            font-weight: 500;
            color: #555;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-car me-2"></i>AutoPartage <span class="badge bg-warning text-dark">PRO</span>
        </a>
        <div class="d-flex align-items-center">
            <a th:href="@{/agent-pro/profil}" class="btn btn-outline-light btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Retour au profil
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="form-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-user-edit me-2 text-primary"></i>Modifier mon profil</h2>
            <p class="text-muted">Mettez à jour les informations de votre entreprise</p>
        </div>

        <form th:action="@{/agent-pro/profil/modifier}" th:object="${user}" method="post">

            <div class="form-section-title">
                <i class="fas fa-building me-2 text-primary"></i>Informations Société
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Raison sociale</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-trademark"></i></span>
                        <input type="text" th:field="*{raisonsociale}" class="form-control" placeholder="Nom de l'entreprise" />
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">SIRET</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                        <input type="text" th:field="*{siret}" class="form-control" placeholder="Numéro SIRET" />
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label">Adresse du siège</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                        <input type="text" th:field="*{adresse}" class="form-control" placeholder="Adresse complète" />
                    </div>
                </div>
            </div>

            <div class="form-section-title">
                <i class="fas fa-address-card me-2 text-primary"></i>Contact & Compte
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" th:field="*{username}" class="form-control" />
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" th:field="*{email}" class="form-control" />
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Téléphone (Contact)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-mobile-alt"></i></span>
                        <input type="text" th:field="*{telephone}" class="form-control" />
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Téléphone Pro</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone-alt"></i></span>
                        <input type="text" th:field="*{telephonepro}" class="form-control" />
                    </div>
                </div>
            </div>

            <div class="form-section-title">
                <i class="fas fa-university me-2 text-primary"></i>Informations Bancaires
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label class="form-label">IBAN</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-money-check"></i></span>
                        <input type="text" th:field="*{iban}" class="form-control" placeholder="FR76..." />
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">BIC</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-globe"></i></span>
                        <input type="text" th:field="*{bic}" class="form-control" placeholder="SWIFT" />
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between pt-3 border-top">
                <a th:href="@{/agent-pro/profil}" class="btn btn-outline-secondary">
                    <i class="fas fa-times me-2"></i>Annuler
                </a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fas fa-save me-2"></i>Enregistrer les modifications
                </button>
            </div>

        </form>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
        <p class="mb-0">© 2026 AutoPartage Pro.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

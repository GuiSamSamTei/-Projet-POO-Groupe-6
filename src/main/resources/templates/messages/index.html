<h2>Messagerie</h2>

<div th:each="conv : ${conversations}">
    <a th:href="@{/messages/{id}(id=${conv.key.id})}">
        <b th:text="${conv.key.username}">User</b><br>
        <small th:text="${conv.value[#lists.size(conv.value)-1].contenu}">
            Dernier message
        </small>
    </a>
</div>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Consulter les Profils des Agents Particuliers</title>
</head>
<body>

<h2>Profils des Agents Particuliers</h2>

<p><strong>Username :</strong> <span th:text="${utilisateur.username}"></span></p>

<hr/>

<p><strong>Adresse :</strong> <span th:text="${utilisateur.adresse}"></span></p>

<hr/>

<p><strong>Note moyenne :</strong>
    <span th:text="${#numbers.formatDecimal(utilisateur.notemoyenne, 1, 'POINT', 2, 'NONE')}"></span>
</p>
<p><strong>Nombre d'évaluations :</strong> <span th:text="${utilisateur.nombreevaluations}"></span></p>
<p><strong>Nombre de véhicules :</strong> <span th:text="${utilisateur.nombrevehicules}"></span></p>

<hr/>

<h3>Véhicules de l’agent</h3>
<ul>
    <li th:each="vehicule : ${vehicules}">
        <!-- Lien vers la page détail du véhicule -->
        <a th:href="@{/vehicule/afficher/{id}(id=${vehicule.id})}">
            <span th:text="${vehicule.marque} + ' ' + ${vehicule.modele}"></span>
        </a>
        - Prix/jour : <span th:text="${vehicule.prixjour}"></span> €
        - Kilométrage : <span th:text="${vehicule.kilometrage}"></span> km
        - Note : <span th:text="${vehicule.notevehicule}"></span>/5
    </li>
</ul>

<a th:href="@{/messages/{id}(id=${utilisateur.id})}">Envoyer message</a>

</body>
</html>

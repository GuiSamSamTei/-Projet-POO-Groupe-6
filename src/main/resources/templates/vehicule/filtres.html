<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Filtres véhicules</title>
</head>
<body>

<h1>Filtrer les véhicules</h1>

<form th:action="@{/filtres}" method="get">

    <!-- Marque -->
    <label>Marque :</label>
    <input type="text" name="marque"><br><br>

    <!-- Modèle -->
    <label>Modèle :</label>
    <input type="text" name="modele"><br><br>

    <!-- Note du véhicule -->
    <label>Note minimale :</label>
    <input type="number" name="noteVehicule" min="0" max="5" step="0.1"><br><br>

    <!-- Date de disponibilité -->
    <label>Date de disponibilité :</label>
    <input type="date" name="dateDispo"><br><br>

    <!-- Ville de disponibilité -->
    <label>Ville :</label>
    <input type="text" name="villeDispo"><br><br>

    <!-- Prix par jour -->
    <label>Prix maximum / jour :</label>
    <input type="number" name="prixJour" step="0.01"><br><br>

    <button type="submit">Appliquer les filtres</button>

</form>

</body>
</html>

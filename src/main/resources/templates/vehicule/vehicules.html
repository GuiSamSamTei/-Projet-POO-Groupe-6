<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des véhicules</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #aaa;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>

<h2>Liste des véhicules</h2>

<table>
    <thead>
    <tr>
        <th>Marque</th>
        <th>Modèle</th>
        <th>Prix/jour</th>
        <th>Couleur</th>
        <th>Disponibilité</th>
        <th>Ville</th>
        <th>Type spécifique</th>
        <th>Attributs spécifiques</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="v : ${vehicules}">
        <!-- Champs communs -->
        <td th:text="${v.marque}">Marque</td>
        <td th:text="${v.modele}">Modèle</td>
        <td th:text="${v.prixjour}">Prix/jour</td>
        <td th:text="${v.couleur}">Couleur</td>
        <td th:text="${v.vehiculedispo ? 'Disponible' : 'Indisponible'}">Disponibilité</td>
        <td th:text="${v.villedispo}">Ville</td>

        <!-- Type réel -->
        <td th:text="${v.typeVehicule}">Type</td>

        <!-- Champs spécifiques selon le type -->
        <td>
                <span th:if="${v.class.simpleName == 'Voiture'}">
                    Portes: <span th:text="${v.portes}"></span>,
                    Coffre: <span th:text="${v.coffre}"></span>
                </span>
            <span th:if="${v.class.simpleName == 'Moto'}">
                    Cylindrée: <span th:text="${v.cylindree}"></span>,
                    Type: <span th:text="${v.typeMoto}"></span>
                </span>
            <!-- Ajouter d'autres types si nécessaire -->
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clôture de Location - AutoPartage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .rating { display: flex; flex-direction: row-reverse; justify-content: start; }
        .rating input { display: none; }
        .rating label { cursor: pointer; width: 40px; font-size: 30px; color: #ddd; }
        .rating input:checked ~ label { color: #f1c40f; }
        .rating label:hover, .rating label:hover ~ label { color: #f1c40f; }
        .km-info { font-size: 0.85rem; color: #6c757d; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header bg-dark text-white p-4">
                    <h3 class="mb-0"><i class="fas fa-handshake me-2 text-primary"></i> Clôture de Contrat</h3>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info mb-4">
                        Vous terminez la location du véhicule <strong th:text="${contrat.vehicule.marque + ' ' + contrat.vehicule.modele}"></strong>
                        loué par <strong th:text="${contrat.loueur.prenom + ' ' + contrat.loueur.nom}"></strong>.
                    </div>

                    <form th:action="@{/historique-location/contrat/valider-cloture}" method="post">
                        <input type="hidden" name="contratId" th:value="${contrat.id}">

                        <div class="mb-4">
                            <label class="form-label fw-bold">1. État de retour du véhicule</label>

                            <div class="mb-3 p-3 border rounded bg-white">
                                <label for="nouveauKilometrage" class="form-label small fw-bold text-muted">Kilométrage actuel au compteur :</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-tachometer-alt"></i></span>
                                    <input type="number"
                                           id="nouveauKilometrage"
                                           name="nouveauKilometrage"
                                           class="form-control"
                                           th:min="${contrat.vehicule.kilometrage}"
                                           th:placeholder="${contrat.vehicule.kilometrage}"
                                           required>
                                    <span class="input-group-text">km</span>
                                </div>
                                <div class="km-info mt-1">
                                    <i class="fas fa-info-circle me-1"></i>
                                    Kilométrage enregistré au départ : <span th:text="${contrat.vehicule.kilometrage}"></span> km
                                </div>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="disponibilite" id="dispo" checked>
                                <label class="form-check-label" for="dispo">
                                    Remettre le véhicule en disponibilité immédiate
                                </label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">2. Notez le Loueur (Comment s'est passée la rencontre ?)</label>
                            <div class="rating mb-2">
                                <input type="radio" name="note" value="5" id="5"><label for="5">☆</label>
                                <input type="radio" name="note" value="4" id="4"><label for="4">☆</label>
                                <input type="radio" name="note" value="3" id="3" checked><label for="3">☆</label>
                                <input type="radio" name="note" value="2" id="2"><label for="2">☆</label>
                                <input type="radio" name="note" value="1" id="1"><label for="1">☆</label>
                            </div>
                            <textarea class="form-control" name="commentaire" rows="3" placeholder="Écrivez un petit avis sur le sérieux du loueur..."></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                                <i class="fas fa-check me-2"></i> Confirmer la fin de location
                            </button>
                            <a th:href="@{/agent-par/historique-location}" class="btn btn-link text-muted text-decoration-none">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

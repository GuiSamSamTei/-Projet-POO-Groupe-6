<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entretiens Techniques</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<h1>Entretiens techniques pour le véhicule : <span th:text="${vehicule.marque} + ' ' + ${vehicule.modele}"></span></h1>

<!-- Formulaire d'ajout -->
<form th:action="@{/controletechnique/entretiens/enregistrer}" th:object="${entretien}" method="post">
    <input type="hidden" th:field="*{vehicule.id}"/>
    <div>
        <label>Type d'entretien :</label>
        <input type="text" th:field="*{typeEntretien}" placeholder="Ex: Changement de roue" required/>
    </div>
    <div>
        <label>Date :</label>
        <input type="date" th:field="*{dateEntretien}" required/>
    </div>
    <div>
        <label>Commentaire :</label>
        <textarea th:field="*{commentaire}" placeholder="Optionnel"></textarea>
    </div>
    <button type="submit">Enregistrer</button>
</form>

<hr/>

<!-- Liste des entretiens -->
<h2>Historique des entretiens</h2>
<table border="1">
    <thead>
    <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Commentaire</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ent : ${entretiens}">
        <td th:text="${ent.dateEntretien}"></td>
        <td th:text="${ent.typeEntretien}"></td>
        <td th:text="${ent.commentaire}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
